[pytest]
testpaths = lab4_selenium_webui lab5_redfish_pytest
python_files = test_*.py openbmc_*_tests.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::urllib3.exceptions.NotOpenSSLWarning
    ignore::UserWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
